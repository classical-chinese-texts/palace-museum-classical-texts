services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: proofread
      POSTGRES_USER: proofread
      POSTGRES_PASSWORD: proofread_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://proofread:proofread_dev@db:5432/proofread
    volumes:
      - ./uploads:/app/uploads
      - ../texts:/repo/texts:ro
      - ../scripts:/repo/scripts:ro
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
